name: Public portfolio QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  public-portfolio-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run public portfolio contract check
        run: python scripts/check_public_repo_contract.py
